buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath libs.kotlin.metadata.jvm
    }
}

plugins {
    alias(libs.plugins.android.application) apply false
    alias(libs.plugins.kotlin.compose) apply false
    alias(libs.plugins.ksp) apply false
    alias(libs.plugins.hilt.android) apply false
    alias(libs.plugins.detekt) apply false
    alias(libs.plugins.google.services) apply false
    alias(libs.plugins.firebase.crashlytics) apply false
    alias(libs.plugins.firebase.perf) apply false
    alias(libs.plugins.dependency.analysis)
    alias(libs.plugins.gradle.doctor)
    alias(libs.plugins.kover)
}



// ---------------------------------------------------------------------------------------------
// Merged unit-test coverage: ./gradlew koverHtmlReportDebug  (HTML: build/reports/kover/htmlDebug)
//                            ./gradlew koverXmlReportDebug   (XML for CI: build/reports/kover/reportDebug.xml)
//
// Kover 0.9.8+ supports AGP 9's built-in Kotlin (0.9.1 did not: it located variants through the
// Kotlin Android Gradle plugin this repo deliberately never applies, and produced empty reports).
// Kotlin-aware measurement + built-in merging + koverVerify thresholds for CI later.
// ---------------------------------------------------------------------------------------------
// Coverage regression gate for CI (koverVerify): thresholds sit safely under the current
// ~98% line / ~81% branch baseline, so they catch backsliding without blocking honest work.
kover {
    reports {
        verify {
            rule("line coverage") {
                minBound(95)
            }
            rule("branch coverage") {
                bound {
                    coverageUnits = kotlinx.kover.gradle.plugin.dsl.CoverageUnit.BRANCH
                    minValue = 75
                }
            }
        }
    }
}

dependencies {
    kover project(':app')
    kover project(':feature:weather')
    kover project(':core:data')
    kover project(':core:network')
    kover project(':core:common')
    kover project(':core:model')
}

// Coverage measures the logic layers; DI wiring, generated code, Compose UI, and the
// deliberately-untested platform shims are excluded so the percentage
// isn't diluted by shells. NOTE: Kover applies filters in the module that OWNS the classes;
// root-level reports.filters only cover root's (nonexistent) classes, so the same filter set
// is injected into every Kover-applying project below.
def koverExcludedAnnotations = [
    'dagger.Module',
    'dagger.hilt.android.HiltAndroidApp',
    'androidx.compose.runtime.Composable',
]
def koverExcludedClasses = [
    '*.di.*',
    '*_Factory', '*_Factory\$*', '*_*Factory',
    '*_Impl', '*_Impl\$*',
    '*.BuildConfig',
    'hilt_aggregated_deps.*',
    'dagger.hilt.internal.*',
    '*_HiltModules*',
    '*ComposableSingletons*',
    '*\$DefaultImpls',
    'com.erendogan6.havatahminim.ui.view.*',
    'com.erendogan6.havatahminim.ui.theme.*',
    'com.erendogan6.havatahminim.ui.adaptive.*',
    'com.erendogan6.havatahminim.ui.component.*',
    'com.erendogan6.havatahminim.util.Notification*',
    'com.erendogan6.havatahminim.util.BootReceiver*',
    'com.erendogan6.havatahminim.util.CrashReportingTree*',
    'com.erendogan6.havatahminim.util.JankStatsReporter*', // platform shim: JankStats on the window
    'com.erendogan6.havatahminim.util.LocationUtils*',
    'com.erendogan6.havatahminim.extension.NetworkUtils*',
    'com.erendogan6.havatahminim.network.GeminiService*',
    'com.erendogan6.havatahminim.repository.AndroidReverseGeocoder*',
    'com.erendogan6.havatahminim.util.DefaultResourcesProvider*',
    'com.erendogan6.havatahminim.util.Converters*',
]

// Gradle Doctor: build-health watchdog. Warnings only; the useful signals here are the
// JAVA_HOME/daemon checks (the classic two-daemons-on-mac trap) and the slow-task report
// that surfaces regressions as the build grows and moves onto CI runners.
doctor {
    javaHome {
        ensureJavaHomeIsSet = true
        ensureJavaHomeMatches = true
        failOnError = false
    }
    warnWhenNotUsingParallelGC = false // JDK 17 G1 is fine at this build size
    failOnEmptyDirectories = false     // AGP 9 variants legitimately leave empty source dirs
}

// Detekt (incl. the ktlint formatting ruleset) runs per module; configuration is centralized
// here, mirroring the Kover injection below. UI modules get the base-component import bans on
// top of the shared config.
def detektUiModules = [':app', ':feature:weather']
allprojects {
    plugins.withId('io.gitlab.arturbosch.detekt') {
        detekt {
            buildUponDefaultConfig = true
            parallel = true
            def configs = [file("$rootDir/config/detekt/detekt.yml")]
            if (project.path in detektUiModules) {
                configs += file("$rootDir/config/detekt/detekt-ui.yml")
            }
            config.setFrom(configs)
        }
    }
}

// One-time per clone: point git at the committed hooks (pre-commit -> detekt).
tasks.register('installGitHooks', Exec) {
    description = 'Points git core.hooksPath at the committed .githooks directory.'
    commandLine 'git', 'config', 'core.hooksPath', '.githooks'
}

allprojects {
    plugins.withId('org.jetbrains.kotlinx.kover') {
        // Only the merged root report is meaningful. A subproject's own report counts just that
        // module's tests (cross-module coverage lands elsewhere), so e.g. :app's local page shows
        // a misleading ~47% against the true merged ~98%. Disabling the subproject report tasks
        // makes the misleading page impossible to generate; the merged report reads Kover's
        // internal artifacts, not these outputs.
        if (project != rootProject) {
            tasks.matching { it.name.startsWith('koverHtmlReport') || it.name.startsWith('koverXmlReport') }
                .configureEach { enabled = false }
        }
        // Kover writes reports over the previous run without cleaning the directory; since the
        // package -> ns-N page numbering shifts between generations, stale pages from an older
        // run survive and show outdated numbers. Delete the task's own outputs first.
        tasks.matching { it.name.startsWith('koverHtmlReport') || it.name.startsWith('koverXmlReport') }.configureEach {
            doFirst {
                outputs.files.each { it.deleteDir() || it.delete() }
            }
        }
        kover {
            reports {
                filters {
                    excludes {
                        annotatedBy(koverExcludedAnnotations as String[])
                        classes(koverExcludedClasses)
                    }
                }
            }
        }
    }
}
