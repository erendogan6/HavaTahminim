name: Deep scans (weekly)

on:
  schedule:
    - cron: '0 3 * * 3' # Wednesdays 06:00 TRT
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobsf-full:
    name: MobSF full APK analysis
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      MOBSF_URL: http://localhost:8000
      MOBSF_KEY: ci-mobsf-key
      # Pinned tag, run manually below: the services: block gated the whole job on the image's
      # own HEALTHCHECK, which the heavy MobSF image failed to pass in time (flaky "unhealthy").
      MOBSF_IMAGE: opensecurity/mobile-security-framework-mobsf:v4.5.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          cache-read-only: true

      - name: Build release APK
        run: ./gradlew assembleRelease

      - name: Start MobSF
        run: docker run -d --name mobsf -p 8000:8000 -e MOBSF_API_KEY="$MOBSF_KEY" "$MOBSF_IMAGE"

      - name: Wait for MobSF
        run: |
          for i in $(seq 1 60); do
            if curl -sf "$MOBSF_URL" > /dev/null 2>&1; then
              echo "MobSF ready after $((i * 5))s" && exit 0
            fi
            sleep 5
          done
          echo "MobSF did not become ready in 5 minutes"
          docker logs mobsf 2>&1 | tail -50
          exit 1

      - name: Upload + scan APK
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "Scanning $APK"
          RESP=$(curl -sf -F "file=@$APK" "$MOBSF_URL/api/v1/upload" -H "X-Mobsf-Api-Key: $MOBSF_KEY")
          HASH=$(echo "$RESP" | jq -r .hash)
          echo "HASH=$HASH" >> "$GITHUB_ENV"
          curl -sf -X POST "$MOBSF_URL/api/v1/scan" --data "hash=$HASH" \
            -H "X-Mobsf-Api-Key: $MOBSF_KEY" -o /dev/null

      - name: Fetch reports
        run: |
          curl -sf -X POST "$MOBSF_URL/api/v1/report_json" --data "hash=$HASH" \
            -H "X-Mobsf-Api-Key: $MOBSF_KEY" -o mobsf-report.json
          curl -sf -X POST "$MOBSF_URL/api/v1/download_pdf" --data "hash=$HASH" \
            -H "X-Mobsf-Api-Key: $MOBSF_KEY" -o mobsf-report.pdf
          curl -sf -X POST "$MOBSF_URL/api/v1/scorecard" --data "hash=$HASH" \
            -H "X-Mobsf-Api-Key: $MOBSF_KEY" -o mobsf-scorecard.json
          echo "## MobSF security score" >> "$GITHUB_STEP_SUMMARY"
          jq -r '"Score: \(.security_score)/100 — high: \(.high | length), warnings: \(.warning | length)"' \
            mobsf-scorecard.json >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload MobSF reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mobsf-reports
          retention-days: 30
          path: |
            mobsf-report.json
            mobsf-report.pdf
            mobsf-scorecard.json

  ui-tests:
    name: Compose UI tests (GMD)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Enable KVM for the managed emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          cache-read-only: true

      # Deliberately not on every PR: booting an emulator would add minutes to the merge gate.
      - name: Run Compose interaction tests
        run: ./gradlew :feature:weather:pixel6Api34DebugAndroidTest

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ui-test-report
          retention-days: 30
          path: feature/weather/build/reports/androidTests/

  baseline-profile:
    name: Refresh baseline profile (GMD)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Enable KVM for the managed emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          cache-read-only: true

      - name: Generate baseline profile
        run: ./gradlew :app:generateBaselineProfile

      # Deliberately no auto-commit: the diff is reviewed and landed by a human.
      - name: Show drift against the committed profile
        run: git diff --stat app/src/release/generated/baselineProfiles/ || true

      - name: Upload regenerated profiles
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: baseline-profiles
          retention-days: 30
          path: app/src/release/generated/baselineProfiles/
