name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '30 5 * * 1' # Mondays 08:30 TRT

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL (java-kotlin)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # 2026-07-17: even the newest CLI (2.26.1) caps Kotlin support strictly below 2.4.10, one
    # release behind this toolchain. Non-blocking until the extractor catches up; tools: latest
    # below means the job flips back to a real gate on its own. Remove this line then.
    continue-on-error: true
    permissions:
      contents: read
      security-events: write
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || 'ci-placeholder-key' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      # tools: latest — the runner-bundled CLI's Kotlin ceiling lagged one release behind the
      # toolchain (2.26.0 rejected Kotlin 2.4.10); the newest bundle tracks Kotlin faster.
      - uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin
          build-mode: manual
          tools: latest

      # Manual build: the CodeQL Kotlin extractor traces the real compilation.
      - name: Build for extraction
        run: ./gradlew assembleDebug

      - uses: github/codeql-action/analyze@v3
        with:
          category: codeql

  mobsfscan:
    name: mobsfscan (mobile SAST)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      # Findings land in the Security tab next to CodeQL's; report-only by design
      # (|| true), the gate is human review of new findings.
      - name: mobsfscan
        uses: MobSF/mobsfscan@0.4.5
        with:
          args: '. --sarif --output mobsfscan.sarif || true'

      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: mobsfscan.sarif
          category: mobsfscan

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
