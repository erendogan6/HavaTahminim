name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '30 5 * * 1' # Mondays 08:30 TRT

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL (java-kotlin)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # 2026-07-17: even the newest CLI (2.26.1) caps Kotlin support strictly below 2.4.10, one
    # release behind this toolchain. Non-blocking until the extractor catches up; tools: latest
    # below means the job flips back to a real gate on its own. Remove this line then.
    continue-on-error: true
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
        with:
          cache-read-only: true

      # tools: latest, because the runner-bundled CLI's Kotlin ceiling lagged one release behind the
      # toolchain (2.26.0 rejected Kotlin 2.4.10); the newest bundle tracks Kotlin faster.
      - uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4
        with:
          languages: java-kotlin
          build-mode: manual
          tools: latest

      # Manual build: the CodeQL Kotlin extractor traces the real compilation.
      - name: Build for extraction
        run: ./gradlew assembleDebug

      - uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          category: codeql

  mobsfscan:
    name: mobsfscan (mobile SAST)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Findings land in the Security tab next to CodeQL's; report-only by design
      # (|| true), the gate is human review of new findings.
      - name: mobsfscan
        uses: MobSF/mobsfscan@3d87bc570c4614d705547bddb521395663dba353 # 0.4.5
        with:
          args: '. --sarif --output mobsfscan.sarif || true'

      - uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4
        with:
          sarif_file: mobsfscan.sarif
          category: mobsfscan

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
