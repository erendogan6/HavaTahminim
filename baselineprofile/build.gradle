plugins {
    // Unversioned: AGP is already on the root classpath via the app module's plugin alias.
    id 'com.android.test'
    alias(libs.plugins.baselineprofile)
    id 'com.autonomousapps.dependency-analysis'
    id 'io.gitlab.arturbosch.detekt'
}

android {
    namespace = 'com.erendogan6.havatahminim.baselineprofile'
    compileSdk = 37

    defaultConfig {
        minSdk = 28 // benchmark-macro floor; the app itself stays minSdk 26
        targetSdk = 37
        testInstrumentationRunner = 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    targetProjectPath = ':app'

    // Reproducible, CI-friendly device: no physical device or running emulator required.
    testOptions {
        managedDevices {
            allDevices {
                pixel6Api34(com.android.build.api.dsl.ManagedVirtualDevice) {
                    device = 'Pixel 6'
                    apiLevel = 34
                    systemImageSource = 'aosp'
                }
            }
        }
    }
}

baselineProfile {
    managedDevices += 'pixel6Api34'
    useConnectedDevices = false
}

dependencies {
    detektPlugins libs.detekt.formatting

    implementation libs.junit
    implementation libs.androidx.test.runner
    implementation libs.androidx.test.ext.junit
    implementation libs.androidx.uiautomator
    implementation libs.androidx.benchmark.macro.junit4
}
