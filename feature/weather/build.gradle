import com.android.build.api.dsl.ManagedVirtualDevice

plugins {
    // Unversioned: AGP is already on the root classpath via the app module's plugin alias.
    id 'com.android.library'
    alias(libs.plugins.kotlin.compose)
    alias(libs.plugins.kotlin.serialization)
    alias(libs.plugins.ksp)
    alias(libs.plugins.hilt.android)
    id 'com.autonomousapps.dependency-analysis'
    id 'io.gitlab.arturbosch.detekt'
    alias(libs.plugins.screenshot)
    alias(libs.plugins.kover)
}

android {
    experimentalProperties["android.experimental.enableScreenshotTest"] = true
    namespace = 'com.erendogan6.havatahminim.feature.weather'
    compileSdk = 37

    buildFeatures {
        compose = true
    }

    defaultConfig {
        minSdk = 26
        testInstrumentationRunner = 'androidx.test.runner.AndroidJUnitRunner'
    }

    // Same reproducible device the baseline profile uses: no physical device needed.
    testOptions {
        managedDevices {
            allDevices {
                pixel6Api34(ManagedVirtualDevice) {
                    device = 'Pixel 6'
                    apiLevel = 34
                    systemImageSource = 'aosp'
                }
            }
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }
}

// Linux CI rasterizes fonts slightly differently than the macOS-generated goldens;
// tolerate sub-1% pixel drift, still far below any real visual regression.
screenshotTests {
    imageDifferenceThreshold = 0.01f
}

dependencies {
    detektPlugins libs.detekt.formatting

    implementation libs.timber

    api project(':core:data')
    api project(':core:model')
    implementation project(':core:database')
    api project(':core:common')
    implementation project(':core:designsystem')
    // ApiResult/onError appear in ViewModel pipeline signatures.
    api project(':core:network')

    implementation platform(libs.androidx.compose.bom)
    screenshotTestImplementation libs.screenshot.validation.api
    screenshotTestImplementation platform(libs.androidx.compose.bom)
    screenshotTestImplementation libs.androidx.ui.tooling
    screenshotTestImplementation libs.androidx.ui.tooling.preview
    api libs.androidx.ui
    api libs.androidx.ui.graphics
    implementation libs.androidx.material3
    implementation libs.androidx.compose.material.icons.extended

    implementation libs.androidx.navigation.compose
    implementation libs.kotlinx.serialization.core
    implementation libs.androidx.hilt.lifecycle.viewmodel.compose
    api libs.androidx.lifecycle.viewmodel
    implementation libs.androidx.lifecycle.viewmodel.compose
    implementation libs.androidx.lifecycle.runtime.compose

    api libs.kotlinx.coroutines.core

    // Animated weather icons (Today screen center + loading splash).
    implementation libs.lottie.compose

    // ZekAI renders Gemini's markdown answers.
    implementation libs.compose.markdown

    implementation(libs.hilt.android)
    ksp libs.hilt.android.compiler

    testImplementation project(':core:testing')
    testImplementation libs.junit
    testImplementation libs.truth
    testImplementation libs.kotlinx.coroutines.test
    testImplementation libs.turbine

    // Compose UI (interaction) tests: real ViewModels driven by the :core:testing fakes.
    androidTestImplementation project(':core:testing')
    androidTestImplementation libs.junit
    androidTestImplementation libs.truth
    androidTestImplementation libs.androidx.test.ext.junit
    androidTestImplementation libs.androidx.test.runner
    androidTestImplementation platform(libs.androidx.compose.bom)
    androidTestImplementation libs.androidx.compose.ui.test.junit4
    androidTestImplementation libs.androidx.activity.compose
    androidTestImplementation libs.androidx.lifecycle.viewmodel.savedstate
    debugImplementation libs.androidx.compose.ui.test.manifest
}

composeCompiler {
    stabilityConfigurationFiles.add(
        rootProject.layout.projectDirectory.file("config/compose/stability-config.conf"),
    )
    // Opt-in metrics/reports: ./gradlew assembleRelease -PcomposeReports
    if (project.hasProperty("composeReports")) {
        reportsDestination = layout.buildDirectory.dir("compose_reports")
        metricsDestination = layout.buildDirectory.dir("compose_reports")
    }
}
