plugins {
    // Unversioned: AGP is already on the root classpath via the app module's plugin alias.
    id 'com.android.library'
    alias(libs.plugins.kotlin.compose)
    alias(libs.plugins.ksp)
    alias(libs.plugins.hilt.android)
    id 'com.autonomousapps.dependency-analysis'
    alias(libs.plugins.kover)
}

android {
    namespace = 'com.erendogan6.havatahminim.feature.weather'
    compileSdk = 37

    buildFeatures {
        compose = true
    }

    defaultConfig {
        minSdk = 26
    }
    testOptions {
        unitTests {
            // android.util.Log only. Platform *logic* (Location.distanceTo, icu Calendar) was
            // removed from JVM-tested code in the testability refactor — do not reintroduce it
            // and lean on default values (they return 0/false/null silently).
            returnDefaultValues = true
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }
}

