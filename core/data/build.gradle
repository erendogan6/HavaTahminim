plugins {
    // Unversioned: AGP is already on the root classpath via the app module's plugin alias.
    id 'com.android.library'
    alias(libs.plugins.ksp)
    alias(libs.plugins.hilt.android)
    id 'com.autonomousapps.dependency-analysis'
}

android {
    namespace = 'com.erendogan6.havatahminim.core.data'
    compileSdk = 37

    defaultConfig {
        minSdk = 26
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }
}

dependencies {
    // Repository method signatures expose domain models, entities, and injected services.
    api project(':core:model')
    api project(':core:database')
    api project(':core:network')
    api project(':core:common')

    api libs.kotlinx.coroutines.core
    // Repository calls geminiService.model.generateContent and catches SerializationException.
    implementation(libs.generativeai)

    api(libs.hilt.android)
    ksp libs.hilt.android.compiler
}
