plugins {
    // Unversioned: AGP is already on the root classpath via the app module's plugin alias.
    id 'com.android.library'
    alias(libs.plugins.ksp)
    alias(libs.plugins.hilt.android)
    id 'com.autonomousapps.dependency-analysis'
}

android {
    namespace = 'com.erendogan6.havatahminim.core.data'
    compileSdk = 37

    defaultConfig {
        minSdk = 26
    }
    testOptions {
        unitTests {
            // android.util.Log only. Platform *logic* (Location.distanceTo, icu Calendar) was
            // removed from JVM-tested code in the testability refactor — do not reintroduce it
            // and lean on default values (they return 0/false/null silently).
            returnDefaultValues = true
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }
}

dependencies {
    // Repository method signatures expose domain models, entities, and injected services.
    api project(':core:model')
    api project(':core:database')
    api project(':core:network')
    api project(':core:common')

    api libs.kotlinx.coroutines.core

    api(libs.hilt.android)
    ksp libs.hilt.android.compiler

    testImplementation project(':core:testing')
    testImplementation libs.junit
    testImplementation libs.truth
    testImplementation libs.kotlinx.coroutines.test
}
