plugins {
    // Unversioned: AGP is already on the root classpath via the app module's plugin alias.
    id 'com.android.library'
    alias(libs.plugins.ksp)
    alias(libs.plugins.hilt.android)
    id 'com.autonomousapps.dependency-analysis'
    id 'io.gitlab.arturbosch.detekt'
    alias(libs.plugins.kover)
}

android {
    namespace = 'com.erendogan6.havatahminim.core.common'
    compileSdk = 37

    defaultConfig {
        minSdk = 26
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }
}

dependencies {
    detektPlugins libs.detekt.formatting

    // PollenLevel maps model enums (PollenType/PollenRisk) to string resources.
    api project(':core:model')

    // DispatchersModule provides CoroutineDispatcher (public signature).
    api libs.kotlinx.coroutines.core

    api(libs.hilt.android)
    ksp libs.hilt.android.compiler

    testImplementation libs.junit
    testImplementation libs.truth
}
